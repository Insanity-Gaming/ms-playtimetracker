name: Build Plugin

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[no ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=1.0.${{ github.run_number }} -p:AssemblyVersion=1.0.${{ github.run_number }} -p:FileVersion=1.0.${{ github.run_number }}

      - name: Publish
        run: |
          OUT=src/PlaytimeTracker/game/sharp/modules/PlaytimeTracker
          rm -rf "$OUT"
          dotnet publish src/PlaytimeTracker/PlaytimeTracker.csproj -c Release --no-restore --no-build -o "$OUT"
          cp src/PlaytimeTracker/config.json "$OUT/config.json"

      - name: Zip module
        run: cd src/PlaytimeTracker && zip -r ../../module.zip game

      - name: Pack Shared
        run: dotnet pack src/PlaytimeTracker.Shared/PlaytimeTracker.Shared.csproj -c Release --no-restore -p:PackageVersion=1.0.${{ github.run_number }} -o ./nupkgs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: ${{ github.ref_name == 'dev' }}
          files: |
            module.zip
            nupkgs/*.nupkg

      - name: Check if Shared changed
        id: shared_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^src/PlaytimeTracker.Shared/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: NuGet Login
        if: github.ref_name == 'master' && steps.shared_changed.outputs.changed == 'true'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: github.ref_name == 'master' && steps.shared_changed.outputs.changed == 'true'
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --skip-duplicate
